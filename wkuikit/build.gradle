apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        //  Phase 2 · 打开 BuildConfig 生成，用于 Trace/Log 埋点的 DEBUG 守卫
        buildConfig true
    }
    namespace 'com.chat.uikit'

    testOptions {
        // : stub unresolved Android framework calls (e.g. TextUtils) to
        // default values so the merge-forward passthrough unit tests can run
        // under plain JVM without Robolectric.
        unitTests.returnDefaultValues = true
    }
//    kotlin {
//        experimental {
//            coroutines 'enable'
//        }
//    }
}
dependencies {
    api project(':wkbase')
//    implementation "androidx.work:work-runtime:2.8.1"

    // Unit tests ( EP1 数据层透传强制单元测试 +  external-source field-passthrough
    // coverage +  EP5 外部群 Tag 字段透传覆盖 +  GroupQr invite_url Gson 反序列化)
    // 显式带入 org.json 真实实现：Android mockable jar 下的 org.json.JSONObject
    // 会被 returnDefaultValues stub 成空操作，encode/decode 单测就会形同虚设
    // （参见  EP1 codex review round-3 P2）。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.google.code.gson:gson:2.8.9'
    // ViewModel/StateFlow + debounce 单测：kotlinx-coroutines-test 提供 runTest + StandardTestDispatcher，
    // 与 wkbase 保持同版本；用于 GlobalSearchViewModel debounce/sequence 乱序防护验证。
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
