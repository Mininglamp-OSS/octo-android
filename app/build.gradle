plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

// 读取 local.properties 中的 applicationId
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def appId = localProperties.getProperty('applicationId', 'com.example-app.octo')

// 自动更新 google-services.json 中的 package_name
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    def jsonContent = googleServicesFile.text
    def updatedContent = jsonContent.replaceAll(
        /"package_name":\s*"[^"]*"/,
        "\"package_name\": \"${appId}\""
    )
    if (jsonContent != updatedContent) {
        googleServicesFile.write(updatedContent)
        println "✅ google-services.json 的 package_name 已更新为: ${appId}"
    }
}

android {
    signingConfigs {
        release {
            def localProps = new Properties()
            localProps.load(new FileInputStream(rootProject.file("local.properties")))
            storeFile file('my-app.jks')
            storePassword localProps['RELEASE_STORE_PASSWORD']
            keyAlias 'dmwork'
            keyPassword localProps['RELEASE_KEY_PASSWORD']
        }
    }
    namespace 'com.dmwork.im'
    compileSdk rootProject.ext.compileSdkVersion
    aaptOptions.cruncherEnabled = false
    aaptOptions.useNewCruncher = false


    defaultConfig {
        applicationId appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 23
        versionName "1.2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        ndk {
            //根据需要 自行选择添加的对应cpu类型的.so库。
            abiFilters "armeabi-v7a", "arm64-v8a"
//            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
        compileSdkPreview = "UpsideDownCake"
    }

    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            buildConfigField "String", "API_BASE_URL", '"https://api-test.example.com/api"'
            buildConfigField "String", "WEB_BASE_URL", '"https://api-test.example.com/web/"'
        }
        prod {
            dimension "env"
            buildConfigField "String", "API_BASE_URL", '"https://api.example.com/api"'
            buildConfigField "String", "WEB_BASE_URL", '"https://api.example.com/web/"'
        }
    }

    buildTypes {
        release {
            jniDebuggable true
            //  zipAlignEnabled true   //Zipalign优化
            minifyEnabled true  // 是否混淆
            shrinkResources true  // 是否去除无效的资源文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "dmwork-${variant.flavorName}-${variant.buildType.name}-v${variant.versionName}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    api project(':wkbase')
    implementation project(path: ':wkuikit')
    implementation project(path: ':wklogin')
    implementation project(path: ':wkscan')
    implementation project(path: ':wkpush')

    // 性能监控（仅 debug 包）
    debugImplementation('io.github.didi.dokit:dokitx:3.7.11') {
        exclude group: 'com.android.volley', module: 'volley'
    }
    debugImplementation 'com.android.volley:volley:1.2.1'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}