apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String", "PRESET_SERVER_1", "\"${localProperties.getProperty('PROD_API_BASE_URL', 'https://api.example.com')}\""
        buildConfigField "String", "PRESET_SERVER_2", "\"${localProperties.getProperty('DEV_API_BASE_URL', 'https://api.example.com')}\""
        buildConfigField "String", "APP_IDENTIFIER", "\"${localProperties.getProperty('APP_IDENTIFIER', 'octoim')}\""
        buildConfigField "String", "BUGLY_APP_ID", "\"${localProperties.getProperty('BUGLY_APP_ID', '')}\""
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/library_release.kotlin_module']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.chat.base'

    testOptions {
        // : stub unresolved Android framework calls (e.g. TextUtils) to
        // default values so the external-source field-passthrough unit tests
        // can run under plain JVM without Robolectric.
        unitTests.returnDefaultValues = true
    }
}
repositories {
//    flatDir {
//        dirs 'libs'
//    }
}
dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    //  (#227): Chrome Custom Tabs — OCTO 实名认证流程在系统浏览器
    // 容器中打开 verify_url（return_to=dmwork://verified 回落 App）。
    api 'androidx.browser:browser:1.8.0'
    //  / GH #176: Activity Embedding (L3-A) — foldable/tablet dual-pane.
    // Declared at wkbase (widest visibility) so wkuikit + app can both see the
    // SplitInitializer registered via androidx.startup.
    api 'androidx.window:window:1.5.1'
    api 'androidx.startup:startup-runtime:1.1.1'
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    api "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

    api 'com.google.android.material:material:1.12.0'
    api 'androidx.constraintlayout:constraintlayout:2.1.4'
//    api 'com.android.support:design:29.0.0'
    api 'androidx.recyclerview:recyclerview:1.3.2'
    api 'androidx.viewpager2:viewpager2:1.1.0'
    api "io.github.cymchad:BaseRecyclerViewAdapterHelper:4.0.3"

    api 'com.github.li-xiaojun:XPopup:2.9.19'
    api 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    api 'com.alibaba:fastjson:1.2.83'
    //glide
    api('com.github.bumptech.glide:glide:5.0.5') {
        transitive = true
    }
    api 'jp.wasabeef:glide-transformations:4.3.0'
    api('com.squareup.okhttp3:okhttp:5.1.0')
    // https://github.com/LuckSiege/PictureSelector
    api 'io.github.lucksiege:pictureselector:v3.11.2'
    implementation 'io.github.lucksiege:compress:v3.11.2'
    //刷新
    api 'io.github.scwang90:refresh-layout-kernel:2.1.1'      //核心必须依赖
    api 'io.github.scwang90:refresh-header-classics:2.1.1'    //经典刷新头
//    api 'com.scwang.smart:refresh-layout-kernel:2.0.1'
//    //没有使用特殊Header，可以不加这行
//    api 'com.scwang.smart:refresh-header-classics:2.0.1'
//    api 'com.github.ybq:Android-SpinKit:1.4.0'
    api 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation('com.squareup.retrofit2:converter-gson:3.0.0') {
        exclude group: 'com.google.code.gson'
    }
    api 'com.squareup.retrofit2:converter-gson:3.0.0'
//    api 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    api "com.squareup.retrofit2:adapter-rxjava3:3.0.0"
    api 'io.reactivex.rxjava3:rxandroid:3.0.2'
    api 'io.reactivex.rxjava3:rxjava:3.1.11'
    api 'com.github.DSAppTeam:PanelSwitchHelper:v1.5.12'
    // 图片裁剪  https://github.com/CanHub/Android-Image-Cropper
    implementation 'com.vanniktech:android-image-cropper:4.6.0'
    api 'androidx.emoji2:emoji2:1.6.0'
    api "androidx.emoji2:emoji2-views:1.6.0"
    api 'org.jsoup:jsoup:1.21.2'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    api 'com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer:v10.0.0'
    api 'com.airbnb.android:lottie:6.6.2'
    api project(path: ':wkim')

    // Bugly 崩溃日志收集
    api 'com.tencent.bugly:crashreport:latest.release'
    api 'com.tencent.bugly:nativecrashreport:latest.release'

    // Markwon Markdown 渲染
    api 'io.noties.markwon:core:4.6.2'
    api 'io.noties.markwon:ext-strikethrough:4.6.2'
    api 'io.noties.markwon:ext-tables:4.6.2'
    api 'io.noties.markwon:ext-tasklist:4.6.2'
    api 'io.noties.markwon:html:4.6.2'
    api('io.noties.markwon:syntax-highlight:4.6.2') {
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
    api('io.noties:prism4j:2.0.0') {
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
    annotationProcessor 'io.noties:prism4j-bundler:2.0.0'

    // Unit tests ( EP1 channel extras key 契约锁 +  EP2 viewer-relative resolver
    // +  EP3 SpaceFilter 单元测试 +  external-source field-passthrough coverage
    // +  JoinSuccessHelper JSON round-trip tests)
    testImplementation 'junit:junit:4.13.2'
    // : 提供真实 org.json 实现，避免 Android stub 对 host-side JSON 测试返回默认值
    testImplementation 'org.json:json:20231013'
}
