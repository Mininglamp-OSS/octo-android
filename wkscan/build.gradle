apply plugin: 'com.android.library'

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
    namespace 'com.chat.scan'
}

dependencies {
    api project(':wkbase')//二维码扫描
    implementation 'com.github.jenly1314:zxing-lite:3.2.0'
   // implementation 'com.github.jenly1314:zxing-lite:2.1.1'

    // YUJ-372 Phase 2 · 本模块新增 host-side 单测（ScanJoinGroupNeedSpaceTest）
    // 需要显式挂载 junit + org.json（wkbase 的 testImplementation 不会传递到
    // 依赖方 module，每个 module 要单独声明）。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
