apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    namespace 'com.chat.uikit'

    testOptions {
        unitTests.returnDefaultValues = true
    }
//    kotlin {
//        experimental {
//            coroutines 'enable'
//        }
//    }
}
dependencies {
    api project(':wkbase')
//    implementation "androidx.work:work-runtime:2.8.1"

    // Unit tests (YUJ-86 EP1 数据层透传强制单元测试 + YUJ-90 EP5 外部群 Tag 字段透传覆盖)
    // 显式带入 org.json 真实实现：Android mockable jar 下的 org.json.JSONObject
    // 会被 returnDefaultValues stub 成空操作，encode/decode 单测就会形同虚设
    // （参见 YUJ-86 EP1 codex review round-3 P2）。
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
