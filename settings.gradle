pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven {url 'https://developer.huawei.com/repo/'}
        maven {
            url "https://maven.google.com"
        }
        // AdaptiveCards SDK 自编 AAR（Teams-AdaptiveCards-Mobile / MIT）
        flatDir { dirs "$rootDir/wkuikit/libs" }
    }
}
rootProject.name = "OctoIM"
include ':MyLibs:vivopush'
include ':MyLibs:xiaomipush'
include ':MyLibs:oppopush'
include ':app'
include ':wkbase'
include ':wkuikit'
include ':wkscan'
include ':wklogin'
include ':wkpush'
include ':wkim'
