plugins {
    id 'com.android.library'
    id 'kotlin-parcelize'
    id 'kotlin-android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String", "XIAOMI_APP_ID", "\"${localProperties.getProperty('XIAOMI_APP_ID', '')}\""
        buildConfigField "String", "XIAOMI_APP_KEY", "\"${localProperties.getProperty('XIAOMI_APP_KEY', '')}\""
        buildConfigField "String", "HUAWEI_APP_ID", "\"${localProperties.getProperty('HUAWEI_APP_ID', '')}\""
        buildConfigField "String", "OPPO_APP_KEY", "\"${localProperties.getProperty('OPPO_APP_KEY', '')}\""
        buildConfigField "String", "OPPO_APP_SECRET", "\"${localProperties.getProperty('OPPO_APP_SECRET', '')}\""
        buildConfigField "String", "VIVO_API_KEY", "\"${localProperties.getProperty('VIVO_API_KEY', '')}\""

        manifestPlaceholders = [
            HUAWEI_APP_ID: localProperties.getProperty('HUAWEI_APP_ID', ''),
            VIVO_API_KEY : localProperties.getProperty('VIVO_API_KEY', ''),
            VIVO_APP_ID  : localProperties.getProperty('VIVO_APP_ID', ''),
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'com.chat.push'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    api project(':wkbase')
    implementation 'com.huawei.hms:push:6.12.0.300'
    implementation project(path: ':MyLibs:xiaomipush')

    //oppo
    implementation project(path: ':MyLibs:oppopush')
    //vivo
    implementation project(path: ':MyLibs:vivopush')
    // firebase
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // host-side 单测（ExampleUnitTest）需要显式挂载 junit（与 wkscan 同处理）。
    testImplementation 'junit:junit:4.13.2'

}
